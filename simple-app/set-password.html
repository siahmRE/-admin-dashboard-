<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Set your password — Admin Dashboard</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/icon-192.png" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom: 24px;">
        <h1 style="font-size:22px; font-weight:600;">Set your password</h1>
        <p class="muted" style="margin-top:6px; font-size:14px;">You signed in with a temporary password. Choose a new one only you know.</p>
      </div>

      <form id="form" class="card">
        <div class="field">
          <label for="newPassword">New password</label>
          <input class="input" id="newPassword" type="password" required minlength="10" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input class="input" id="confirm" type="password" required autocomplete="new-password" />
        </div>
        <div id="error" class="alert alert-danger hidden"></div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Save password and continue</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/config.js"></script>
  <script src="/assets/supabase-client.js"></script>
  <script src="/assets/auth-guard.js"></script>
  <script>
    const form = document.getElementById("form");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) window.location.href = "/login.html";
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const newPassword = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirm").value;

      if (newPassword.length < 10) {
        errorBox.textContent = "Password must be at least 10 characters.";
        errorBox.classList.remove("hidden");
        return;
      }
      if (newPassword !== confirm) {
        errorBox.textContent = "Passwords don't match.";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";

      // A signed-in user can always change their own password directly —
      // no privileged server action needed for this one.
      const { error } = await sb.auth.updateUser({
        password: newPassword,
        data: { must_change_password: false },
      });

      if (error) {
        errorBox.textContent = "Could not update password. Try again.";
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Save password and continue";
        return;
      }

      const { data: { user } } = await sb.auth.getUser();
      const { data: profile } = await sb.from("profiles").select("role").eq("id", user.id).single();
      window.location.href = profile?.role === "admin" ? "/admin/index.html" : "/index.html";
    });
  </script>
</body>
</html>
